<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur de Moyenne</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%233b82f6;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%231e40af;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23grad)'/%3E%3Ctext x='50' y='70' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'%3E%F0%9F%94%A2%3C/text%3E%3C/svg%3E">
  
  <!-- External Dependencies -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  
  <!-- Local Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#3b82f6",
            "background-dark": "#0f172a",
            "surface-dark": "#1e293b",
            "surface-card": "#334155",
            "surface-hover": "#475569",
            "text-secondary": "#94a3b8",
          },
          fontFamily: {
            "display": ["Manrope", "sans-serif"]
          },
        },
      },
    }
  </script>
</head>

<body class="bg-background-dark text-white h-screen overflow-hidden">
  <!-- Particle Animation Canvas -->
  <canvas id="canvas-bg" class="particles-js-canvas-el"></canvas>  
  
  <!-- Main Application Container -->
  <div class="flex flex-col h-screen w-full relative" style="z-index: 10;">
    
    <!-- ====================================================================
         Header: Logo, Branding & Navigation Controls
         ==================================================================== -->
    <header class="flex flex-col md:flex-row items-start md:items-center justify-between px-4 md:px-8 py-4 md:py-5 border-b-2 border-primary/30 bg-gradient-to-r from-surface-dark via-surface-card to-surface-dark backdrop-blur-2xl z-50 shrink-0 gap-4 shadow-xl shadow-primary/5 relative overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-r from-primary/5 via-transparent to-blue-500/5 pointer-events-none"></div>
      <div class="flex items-center gap-3 md:gap-4 relative z-10 animate-slide-in">
        <div class="relative group animate-float">
          <div class="absolute inset-0 bg-gradient-to-br from-primary to-blue-700 rounded-2xl blur-lg opacity-50 group-hover:opacity-75 transition-opacity duration-300"></div>
          <div class="relative flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-br from-primary to-blue-700 text-white shadow-lg shadow-primary/50 transform hover:scale-110 transition-all duration-300 cursor-pointer">
            <span class="material-symbols-outlined text-2xl font-bold">calculate</span>
          </div>
        </div>
        <div>
          <h2 class="text-xl md:text-2xl font-black tracking-tighter bg-gradient-to-r from-white to-primary bg-clip-text text-transparent">GradeCalc</h2>
          <p class="text-[10px] md:text-xs text-text-secondary font-semibold tracking-wide">Calculateur intelligent</p>
        </div>
      </div>

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 sm:gap-3 md:gap-4 w-full md:w-auto relative z-10 animate-slide-in-right">
        <select id="cycleSelect" class="w-full sm:w-28 md:w-36 px-3 md:px-4 py-2.5 rounded-xl bg-surface-card/80 backdrop-blur-sm border-2 border-surface-hover hover:border-primary/50 text-white text-sm md:text-base font-bold focus:border-primary focus:ring-2 focus:ring-primary/50 transition-all duration-300 cursor-pointer">
          <option value="Licence">Licence</option>
          <option value="Master">Master</option>
        </select>
        
        <select id="levelSelect" class="w-full sm:w-32 md:w-40 px-3 md:px-4 py-2.5 rounded-xl bg-surface-card/80 backdrop-blur-sm border-2 border-surface-hover hover:border-primary/50 text-white text-sm md:text-base font-bold focus:border-primary focus:ring-2 focus:ring-primary/50 transition-all duration-300 cursor-pointer">
        </select>

        <select id="semesterSelect" class="w-full sm:w-40 md:w-48 px-3 md:px-4 py-2.5 rounded-xl bg-surface-card/80 backdrop-blur-sm border-2 border-surface-hover hover:border-primary/50 text-white text-sm md:text-base font-bold focus:border-primary focus:ring-2 focus:ring-primary/50 transition-all duration-300 cursor-pointer">
        </select>
        
        <div class="flex items-center gap-2 sm:border-l-2 sm:border-primary/30 sm:pl-3 md:pl-4">
          <div class="relative group">
            <div class="absolute inset-0 bg-gradient-to-r from-red-600 to-red-700 rounded-xl blur-md opacity-0 group-hover:opacity-60 transition-opacity duration-300"></div>
            <button id="clearBtn" class="relative w-full sm:w-auto px-4 py-2.5 rounded-xl bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white font-bold transition-all duration-300 shadow-lg hover:shadow-red-500/50 transform hover:scale-110 cursor-pointer">
              <span class="material-symbols-outlined text-xl">delete</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- ====================================================================
         Main Content: Semester Title & Dynamic Modules Container
         ==================================================================== -->
    <main class="flex-1 overflow-y-auto pb-40 md:pb-32 animate-fade-in scroll-smooth">
      <div class="max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-10">
        <div class="flex flex-col gap-2 mb-6 md:mb-8">
          <h1 id="semesterTitle" class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-black tracking-tight bg-gradient-to-r from-white via-primary to-white bg-clip-text text-transparent animate-fade-in"></h1>
          <p class="text-text-secondary text-sm md:text-base font-semibold animate-fade-in">Entrez vos notes pour calculer votre moyenne instantanément.</p>
        </div>

        <div id="unitsContainer"></div>
      </div>
    </main>

    <!-- ====================================================================
         Results Display: Semester Average, Credits & Pass Status
         ==================================================================== -->
    <div class="fixed bottom-0 left-0 right-0 p-3 md:p-6 lg:p-8 flex justify-center pointer-events-none z-50 animate-scale-in">
      <div class="pointer-events-auto bg-gradient-to-br from-surface-card via-surface-dark to-surface-card border-2 border-primary/30 rounded-2xl md:rounded-3xl px-4 sm:px-6 md:px-8 lg:px-10 py-4 md:py-5 lg:py-6 flex flex-col md:flex-row items-center justify-between gap-4 md:gap-6 lg:gap-12 w-full max-w-2xl shadow-[0_20px_60px_rgba(59,130,246,0.2)] backdrop-blur-2xl relative overflow-hidden hover:shadow-[0_20px_80px_rgba(59,130,246,0.3)] transition-shadow duration-500 animate-glow">
        <div class="absolute inset-0 bg-gradient-to-r from-primary/10 via-transparent to-blue-500/10 pointer-events-none"></div>
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary to-transparent"></div>
        <div class="flex flex-col gap-1.5 md:gap-2 z-10 text-center md:text-left">
          <p class="text-text-secondary text-[10px] md:text-xs font-black uppercase tracking-[0.15em] md:tracking-[0.2em]">Moyenne du Semestre</p>
          <div class="flex items-center gap-2 md:gap-3 justify-center md:justify-start">
            <div class="relative">
              <span class="absolute inset-0 w-2 h-2 md:w-2.5 md:h-2.5 rounded-full bg-primary blur-sm animate-pulse"></span>
              <span class="relative block w-2 h-2 md:w-2.5 md:h-2.5 rounded-full bg-primary shadow-[0_0_10px_#3b82f6]"></span>
            </div>
            <span class="text-white text-xs md:text-sm font-bold">
              Crédits: <span id="creditsEarned">0</span> / <span id="totalCredits">0</span>
            </span>
          </div>
        </div>
        <div class="flex items-baseline gap-1.5 md:gap-2 z-10">
          <span id="semesterAvg" class="text-4xl sm:text-5xl md:text-6xl font-black text-white tracking-tighter tabular-nums drop-shadow-[0_0_20px_rgba(59,130,246,0.5)]">
            0.00
          </span>
          <span class="text-xl sm:text-2xl font-black text-primary drop-shadow-[0_0_10px_rgba(59,130,246,0.5)]">/20</span>
        </div>
        <div id="passStatus" class="absolute right-3 md:right-4 top-3 md:top-4 px-2 md:px-3 py-1 md:py-1.5 rounded-full text-[10px] md:text-xs font-black bg-red-500/20 text-red-400 border border-red-500/30 backdrop-blur-sm transition-all duration-300">
          NON ADMIS
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Dependencies -->
  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
